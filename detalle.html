<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Enlace al archivo CSS compartido -->

  <!-- Cabecera de navegación -->

    <a href="index.html">Talleres</a>

  <main>
    <!-- 1. Detalle del Taller -->
    <section class="detalle-taller">
      <h1>Introducción a Python</h1>
      <p class="instructor">Instructor: Ing. María López</p>
      <p class="fecha">Fecha: <time datetime="2026-08-10">2026-08-10</time></p>
      <p class="asistentes">Asistentes registrados: 133 / 25</p>

    <!-- 2. Formulario de Registro de Asistencia -->

      <h2>Registrar asistencia</h2>

        <input type="text" placeholder="Nombre completo" required>
        <input type="text" placeholder="Boleta" required>
        <button type="submit" class="btn">Registrar</button>

    <!-- 3. Bitácora de Alumnos Registrados -->

      <h2>Alumnos registrados</h2>
      <p class="alerta-estado">No autorizado</p>
    </section>
